name: ci

on:
  push:
  pull_request:

jobs:
  bash-lint:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: bash syntax check
        run: bash -n check-ollama.sh
      - name: shellcheck
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q shellcheck
          shellcheck -x check-ollama.sh

  python-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install ".[dev]"
      - name: ruff check
        run: ruff check canary_ollama/
      - name: ruff format check
        run: ruff format --check canary_ollama/
      - name: mypy
        run: mypy canary_ollama/

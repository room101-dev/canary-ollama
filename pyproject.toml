[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canary-ollama"
version = "0.1.0"
description = "Audit Ollama models for poisoning — Python API, CLI, and server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "c4nary>=0.1.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.100", "uvicorn>=0.23"]
watch = ["watchdog>=3.0"]
dev = ["pytest", "ruff", "mypy"]
all = ["canary-ollama[server,watch,dev]"]

[project.scripts]
canary-ollama = "canary_ollama.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["canary_ollama"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
